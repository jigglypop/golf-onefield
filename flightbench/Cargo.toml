[package]
name = "flightbench"
version = "0.1.0"
edition = "2024"
default-run = "flightbench"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true

# 시험대용: 최적화는 유지하고 링크 시간 최적화를 빼서 다시 빌드를 몇 초로
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug = false
